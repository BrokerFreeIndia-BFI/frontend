name: CI

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  detect:
    name: Detect workspace apps
    runs-on: ubuntu-latest
    outputs:
      has_mobile: ${{ steps.mobile.outputs.has_mobile }}
      mobile_package: ${{ steps.mobile.outputs.mobile_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect React Native package
        id: mobile
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            "apps/mobile/package.json"
            "apps/native/package.json"
            "apps/react-native/package.json"
          )

          for package_json in "${candidates[@]}"; do
            if [[ -f "$package_json" ]]; then
              package_name="$(node -p "require('./${package_json}').name")"
              echo "has_mobile=true" >> "$GITHUB_OUTPUT"
              echo "mobile_package=${package_name}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "has_mobile=false" >> "$GITHUB_OUTPUT"
          echo "mobile_package=" >> "$GITHUB_OUTPUT"

  workspace:
    name: Workspace / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - check-types
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: pnpm turbo run ${{ matrix.task }} --cache-dir=.turbo --concurrency=100%

  web:
    name: Web app build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web and dependencies
        run: pnpm turbo run build --filter=@bfi/web... --cache-dir=.turbo --concurrency=100%

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: React Native / ${{ matrix.task }}
    needs: detect
    if: needs.detect.outputs.has_mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - check-types
          - test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile ${{ matrix.task }}
        env:
          MOBILE_PACKAGE: ${{ needs.detect.outputs.mobile_package }}
        run: pnpm --filter "$MOBILE_PACKAGE" run --if-present ${{ matrix.task }}
